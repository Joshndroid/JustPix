<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login - __APP_TITLE__</title>
    <link rel="icon" type="image/png" sizes="16x16" href="__ROOT_PATH__/static/favicon-16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="__ROOT_PATH__/static/favicon-32.png">
    <link rel="icon" type="image/png" sizes="192x192" href="__ROOT_PATH__/static/icon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="__ROOT_PATH__/static/icon-512.png">
    <link rel="apple-touch-icon" sizes="180x180" href="__ROOT_PATH__/static/apple-touch-icon.png">
    <link rel="stylesheet" href="__ROOT_PATH__/static/style.css?v=20260503-2">
  </head>
  <body class="login-page" data-root-path="__ROOT_PATH__">
    <main class="login-panel">
      <div class="brand login-brand">
        <img class="brand-mark" src="__ROOT_PATH__/static/icon-512.png" alt="" width="38" height="38">
        <span>__APP_TITLE__</span>
      </div>
      <form id="loginForm" method="post" action="__ROOT_PATH__/login">
        <label>
          Username
          <input name="username" autocomplete="username" required autofocus>
        </label>
        <label>
          Password
          <input name="password" type="password" autocomplete="current-password" required>
        </label>
        <p id="loginError" class="form-error" hidden></p>
        <button type="submit">Login</button>
      </form>
    </main>
    <script src="__ROOT_PATH__/static/login.js?v=20260503-2"></script>
  </body>
</html>
