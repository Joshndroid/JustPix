<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login - __APP_TITLE__</title>
    <link rel="stylesheet" href="__ROOT_PATH__/static/style.css">
  </head>
  <body class="login-page" data-root-path="__ROOT_PATH__">
    <main class="login-panel">
      <div class="brand login-brand">
        <span class="brand-mark">J</span>
        <span>__APP_TITLE__</span>
      </div>
      <form id="loginForm" method="post" action="__ROOT_PATH__/login">
        <label>
          Username
          <input name="username" autocomplete="username" required autofocus>
        </label>
        <label>
          Password
          <input name="password" type="password" autocomplete="current-password" required>
        </label>
        <p id="loginError" class="form-error" hidden></p>
        <button type="submit">Login</button>
      </form>
    </main>
    <script src="__ROOT_PATH__/static/login.js"></script>
  </body>
</html>
