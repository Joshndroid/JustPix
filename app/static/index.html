<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>__APP_TITLE__</title>
    <link rel="icon" type="image/png" sizes="16x16" href="__ROOT_PATH__/static/favicon-16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="__ROOT_PATH__/static/favicon-32.png">
    <link rel="icon" type="image/png" sizes="192x192" href="__ROOT_PATH__/static/icon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="__ROOT_PATH__/static/icon-512.png">
    <link rel="apple-touch-icon" sizes="180x180" href="__ROOT_PATH__/static/apple-touch-icon.png">
    <link rel="stylesheet" href="__ROOT_PATH__/static/style.css?v=__STATIC_VERSION__">
  </head>
  <body data-root-path="__ROOT_PATH__" data-auth-enabled="__AUTH_ENABLED__">
    <div class="app-shell">
      <header class="topbar">
        <a class="brand" href="__ROOT_PATH__/browse/" data-nav-path="">
          <img class="brand-mark" src="__ROOT_PATH__/static/icon-512.png" alt="" width="38" height="38">
          <span>__APP_TITLE__</span>
        </a>
        <div class="topbar-actions">
          <select id="sortSelect" aria-label="Sort">
            <option value="name_asc">Name A-Z</option>
            <option value="name_desc">Name Z-A</option>
            <option value="date_desc">Newest</option>
            <option value="date_asc">Oldest</option>
          </select>
          <a id="adminLink" class="topbar-link" href="__ROOT_PATH__/admin" hidden>Admin</a>
          <form id="logoutForm" class="logout" method="post" action="__ROOT_PATH__/logout">
            <button type="submit" title="Logout">Logout</button>
          </form>
        </div>
      </header>

      <nav id="breadcrumbs" class="breadcrumbs" aria-label="Breadcrumb"></nav>

      <section class="summary" aria-live="polite">
        <div>
          <strong id="folderName">Library</strong>
          <span id="folderStats"></span>
        </div>
        <div class="pager">
          <button id="prevPage" type="button" title="Previous page">Prev</button>
          <span id="pageLabel">Page 1</span>
          <button id="nextPage" type="button" title="Next page">Next</button>
        </div>
      </section>

      <section id="grid" class="gallery-grid" aria-live="polite"></section>
      <p id="emptyState" class="empty" hidden>No media in this folder.</p>
    </div>

    <dialog id="lightbox" class="lightbox">
      <button id="closeLightbox" class="lightbox-close" type="button" title="Close">Close</button>
      <button id="prevItem" class="lightbox-nav prev" type="button" title="Previous">Prev</button>
      <div id="lightboxStage" class="lightbox-stage"></div>
      <button id="nextItem" class="lightbox-nav next" type="button" title="Next">Next</button>
      <footer id="lightboxCaption" class="lightbox-caption"></footer>
    </dialog>

    <script src="__ROOT_PATH__/static/gallery.js?v=__STATIC_VERSION__"></script>
  </body>
</html>
