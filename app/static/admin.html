<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin - __APP_TITLE__</title>
    <link rel="icon" type="image/png" sizes="16x16" href="__ROOT_PATH__/static/favicon-16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="__ROOT_PATH__/static/favicon-32.png">
    <link rel="icon" type="image/png" sizes="192x192" href="__ROOT_PATH__/static/icon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="__ROOT_PATH__/static/icon-512.png">
    <link rel="apple-touch-icon" sizes="180x180" href="__ROOT_PATH__/static/apple-touch-icon.png">
    <link rel="stylesheet" href="__ROOT_PATH__/static/style.css">
  </head>
  <body data-root-path="__ROOT_PATH__">
    <main class="admin-shell">
      <header class="topbar">
        <a class="brand" href="__ROOT_PATH__/browse/">
          <img class="brand-mark" src="__ROOT_PATH__/static/icon-512.png" alt="" width="38" height="38">
          <span>__APP_TITLE__</span>
        </a>
        <a class="topbar-link" href="__ROOT_PATH__/browse/">Gallery</a>
      </header>

      <section class="admin-layout">
        <div>
          <h1 class="panel-title">Users</h1>
          <div id="userList" class="user-list" aria-live="polite"></div>
        </div>

        <form id="createUserForm" class="admin-panel" method="post" action="__ROOT_PATH__/admin/users">
          <h2>Add user</h2>
          <label>
            Username
            <input name="username" autocomplete="username" required>
          </label>
          <label>
            Display name
            <input name="display_name" autocomplete="name">
          </label>
          <label>
            Password
            <input name="password" type="password" autocomplete="new-password" minlength="8" required>
          </label>
          <label>
            Role
            <select name="role">
              <option value="user" selected>User</option>
              <option value="admin">Admin</option>
            </select>
          </label>
          <p id="adminMessage" class="form-error" hidden></p>
          <button type="submit">Add user</button>
        </form>
      </section>
    </main>
    <script src="__ROOT_PATH__/static/admin.js"></script>
  </body>
</html>
