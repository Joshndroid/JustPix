<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Setup - __APP_TITLE__</title>
    <link rel="icon" type="image/png" sizes="16x16" href="__ROOT_PATH__/static/favicon-16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="__ROOT_PATH__/static/favicon-32.png">
    <link rel="icon" type="image/png" sizes="192x192" href="__ROOT_PATH__/static/icon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="__ROOT_PATH__/static/icon-512.png">
    <link rel="apple-touch-icon" sizes="180x180" href="__ROOT_PATH__/static/apple-touch-icon.png">
    <link rel="stylesheet" href="__ROOT_PATH__/static/style.css?v=__STATIC_VERSION__">
  </head>
  <body class="login-page" data-root-path="__ROOT_PATH__">
    <main class="login-panel">
      <div class="brand login-brand">
        <img class="brand-mark" src="__ROOT_PATH__/static/icon-512.png" alt="" width="38" height="38">
        <span>__APP_TITLE__</span>
      </div>
      <h1 class="panel-title">Create admin</h1>
      <form id="setupForm" method="post" action="__ROOT_PATH__/setup">
        <label>
          Username
          <input name="username" autocomplete="username" required autofocus>
        </label>
        <label>
          Display name
          <input name="display_name" autocomplete="name">
        </label>
        <label>
          Password
          <input name="password" type="password" autocomplete="new-password" minlength="8" required>
        </label>
        <p id="setupError" class="form-error" hidden></p>
        <button type="submit">Create admin</button>
      </form>
    </main>
    <script src="__ROOT_PATH__/static/setup.js?v=__STATIC_VERSION__"></script>
  </body>
</html>
