<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Setup - __APP_TITLE__</title>
    <link rel="stylesheet" href="__ROOT_PATH__/static/style.css">
  </head>
  <body class="login-page" data-root-path="__ROOT_PATH__">
    <main class="login-panel">
      <div class="brand login-brand">
        <span class="brand-mark">J</span>
        <span>__APP_TITLE__</span>
      </div>
      <h1 class="panel-title">Create admin</h1>
      <form id="setupForm" method="post" action="__ROOT_PATH__/setup">
        <label>
          Username
          <input name="username" autocomplete="username" required autofocus>
        </label>
        <label>
          Display name
          <input name="display_name" autocomplete="name">
        </label>
        <label>
          Password
          <input name="password" type="password" autocomplete="new-password" minlength="8" required>
        </label>
        <p id="setupError" class="form-error" hidden></p>
        <button type="submit">Create admin</button>
      </form>
    </main>
    <script src="__ROOT_PATH__/static/setup.js"></script>
  </body>
</html>
